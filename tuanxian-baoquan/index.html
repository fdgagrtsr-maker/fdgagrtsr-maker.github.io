"tags": ["应结日期", "实结日期"], "related": ["memo"]}, {"id": "claim", "title": "理赔发起的主动解约", "group": "特殊业务处理", "intro": "核对理赔主动解约所需资料，以及协议减人和家庭单的处理要求。", "sections": [{"title": "所需资料", "kind": "materials", "items": ["特殊作业签呈", "投保人账户复印件（家庭单提供）"], "text": ""}, {"title": "注意事项", "kind": "list", "items": ["在系统中作业“协议减人”时，应注意最低3个被保险人的人数限制。", "家庭单要减掉的人为投保人时，应作业“协议解约”。"], "text": ""}], "tags": ["协议减人", "家庭单"], "related": ["memo"]}, {"id": "correction", "title": "修订新契约录入错误", "group": "特殊业务处理", "intro": "先反馈确认，再核对可通过保全项目变更的内容。", "sections": [{"title": "所需资料", "kind": "materials", "items": ["特殊作业签呈"], "text": ""}, {"title": "注意事项", "kind": "list", "items": ["原则上新契约录入错误应通过数据修改完成，发现问题后应先反馈给健康险事业部。", "仅对保全项目中可变更的内容进行修改。"], "text": ""}], "tags": ["录入修订"], "related": ["memo", "limits"]}, {"id": "memo", "title": "签呈拟定要点", "group": "通用注意事项", "intro": "把申请原因、最终诉求和保单信息写清楚，核对正文与附件是否一致。", "sections": [{"title": "正文与附件", "kind": "list", "items": ["正文内容要与附件信息保持一致。"], "text": ""}, {"title": "必备要素", "kind": "materials", "items": ["申请原因：为什么提起本次申请。", "最终诉求：希望达成什么结果。", "保单号码、被保险人姓名、证件号码。"], "text": ""}, {"title": "拟定注意事项", "kind": "list", "items": ["最终诉求需要覆盖本次申请涉及的规则之外的所有方面。", "审核渠道拟写的签呈，避免反复退件。", "如果情况说明内容不多，尽量写在签呈正文里，不必单独写附件。"], "text": ""}], "tags": ["特殊作业签呈"], "related": ["limits"]}, {"id": "limits", "title": "无法通过特殊作业申请的内容", "group": "通用注意事项", "intro": "核对监管要求、产品条款、作业合规性及保全项目的覆盖范围。", "sections": [{"title": "无法申请的情形", "kind": "list", "items": ["监管红线：例如反洗钱相关规定。", "违背产品条款。", "明显不合规的作业：例如须加盖印章的单证无法加盖印章。", "保全项目无法覆盖的内容：例如后期添加定期结算、家庭团单变更投保人、新增被保险人等。"], "text": ""}], "tags": ["申请范围"], "related": ["special-scope", "memo"]}]</script>
<script id="image-data" type="application/json">{"settlement": "assets/settlement.2a4a7e9f67.png", "payment": "assets/payment.8c1115face.png", "health": "assets/health.8adda01d22.png", "rate-error": "assets/rate-error.e83f118276.png", "benefit": "assets/benefit.35c8ec6be6.png", "commission": "assets/commission.9ecf489e7f.png", "authorization": "assets/authorization.312b6c6e11.png", "service": "assets/service.7a934c5b75.png"}</script>
<script>
'use strict';
const entries=JSON.parse(document.getElementById('business-data').textContent);
const pictures=JSON.parse(document.getElementById('image-data').textContent);
const pictureSizes={"settlement": [1008, 627], "payment": [1026, 106], "health": [1112, 234], "rate-error": [448, 136], "benefit": [1093, 287], "commission": [1094, 291], "authorization": [1034, 436], "service": [253, 247]};
const groups=['重点保全项目','特殊业务处理','通用注意事项'];
const byId=new Map(entries.map(e=>[e.id,e]));
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let activeId=byId.has(location.hash.slice(1))?location.hash.slice(1):'add';
let filtered=entries.slice(),query='',returnFocus=null,searchTimer;
const searchAliases={增人:'增加被保险人',替人:'被保险人替换',定结:'定期结算',更名:'团体客户资料变更',健告:'健康告知',签报:'签呈',佣金:'渠道费用率'};
const plain=entry=>[entry.title,entry.group,entry.intro,...entry.tags,...entry.sections.map(s=>[s.title,s.text,...s.items,...(s.rows||[]).flat(),s.note||''].join(' '))].join(' ').toLocaleLowerCase();
const haystacks=new Map(entries.map(e=>[e.id,plain(e)]));
const number=e=>String(entries.indexOf(e)+1).padStart(2,'0');
function iconZoom(){return '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2h4v4M14 2 9 7M6 14H2v-4m0 4 5-5" stroke="currentColor" stroke-width="1.4"/></svg>';}
function renderToc(){
  $('sideCount').textContent=query?`${filtered.length} 项匹配`:`共 ${entries.length} 项`;
  $('toc').innerHTML=groups.map(group=>{
    const list=filtered.filter(e=>e.group===group);if(!list.length)return '';
    return `<div class="toc-group"><div class="group-head">${group}</div>${list.map(e=>`<button type="button" class="toc-button${activeId===e.id?' active':''}" data-entry="${e.id}"${activeId===e.id?' aria-current="true"':''}><span class="toc-no">${number(e)}</span><span>${esc(e.title)}</span>${activeId===e.id?'<span class="toc-arrow" aria-hidden="true">›</span>':''}</button>`).join('')}</div>`;
  }).join('')||'<p style="padding:12px;font-size:12px;color:#8b947f">没有匹配的业务，请换个关键词。</p>';
  $('toc').querySelectorAll('[data-entry]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.entry,true)));
}
function renderSection(s,index){
 const id=`section-${index}`, title=`<h3 class="section-title">${esc(s.title)}<span class="section-index" aria-hidden="true">${String(index+1).padStart(2,'0')}</span></h3>`;
 const list=(extra='')=>`<ol class="business-list ${extra}">${s.items.map(t=>`<li><span>${esc(t)}</span></li>`).join('')}</ol>`;
 let body='';
 if(['list','materials','steps'].includes(s.kind)) body=title+(s.label?`<div class="section-label">${esc(s.label)}</div>`:'')+list(s.kind==='list'?'':s.kind);
 else if(s.kind==='text') body=title+`<p>${esc(s.text)}</p>`;
 else if(s.kind==='notice') return `<section id="${id}" class="content-section notice ${s.tone==='teal'?'teal':''}">${title}<p>${esc(s.text)}</p></section>`;
 else if(s.kind==='formula') body=title+`<div class="formula"><div class="formula-expression">${esc(s.text)}</div>${list()}</div>`;
 else if(s.kind==='table') body=title+`<div class="table-frame"><table><thead><tr>${s.columns.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 else if(s.kind==='image') body=title+`<figure class="example"><button type="button" data-image="${s.key}" data-title="${esc(s.title)}" aria-label="放大查看${esc(s.title)}"><img src="${pictures[s.key]}" alt="${esc(s.title)}" width="${pictureSizes[s.key][0]}" height="${pictureSizes[s.key][1]}" loading="lazy" decoding="async"><span class="zoom-label">${iconZoom()}点击放大</span></button><figcaption>${esc(s.note)}</figcaption></figure>`;
 return `<section id="${id}" class="content-section">${body}</section>`;
}
function renderPage(){
 const current=byId.get(activeId),pos=filtered.findIndex(e=>e.id===activeId);
 $('mobileCurrent').textContent=current&&filtered.length?current.title:'暂无匹配业务';
 $('mobilePosition').textContent=filtered.length?`${pos+1} / ${filtered.length}`:'0 / 0';
 if(!filtered.length){
  $('page').innerHTML=`<div class="empty"><svg width="43" height="43" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="21" cy="21" r="14" stroke="currentColor" stroke-width="2"/><path d="m32 32 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><h2>暂时没有找到相关业务</h2><p>试试业务名称或材料关键词，例如“定期结算”“投保人变更”“签呈”。</p><button type="button" id="emptyReset">查看全部业务</button></div>`;
  $('emptyReset').addEventListener('click',clearSearch);return;
 }
 const jumps=[];
 const firstMaterial=current.sections.findIndex(s=>s.kind==='materials');
 let firstRule=current.sections.findIndex(s=>s.title==='办理规则');
 if(firstRule<0)firstRule=current.sections.findIndex(s=>s.title==='日期选择');
 if(firstRule<0)firstRule=current.sections.findIndex(s=>s.title==='适用情形'||s.title==='常见特殊业务类型');
 const firstNote=current.sections.findIndex(s=>/注意事项|填写提醒|职业内容|拟定注意|无法申请/.test(s.title));
 const firstImage=current.sections.findIndex(s=>s.kind==='image');
 if(firstMaterial>=0)jumps.push([firstMaterial,'材料清单']);if(firstRule>=0)jumps.push([firstRule,'办理规则']);if(firstNote>=0)jumps.push([firstNote,'受理要点']);if(firstImage>=0)jumps.push([firstImage,'填写示例']);
 $('page').innerHTML=`<div class="page-topline"><span class="category">${esc(current.group)}</span><span class="business-number">业务 ${number(current)}</span></div><h2 id="businessTitle" tabindex="-1">${esc(current.title)}</h2><p class="intro">${esc(current.intro)}</p><div class="tags">${current.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${jumps.length?`<nav class="section-jumps" aria-label="本业务内容导航">${jumps.map(([i,t])=>`<a href="#section-${i}" data-jump="section-${i}">${t}</a>`).join('')}</nav>`:'<div style="height:25px"></div>'}<div id="businessContent">${current.sections.map(renderSection).join('')}</div><footer class="reader-footer"><div><span class="footer-group">${esc(current.group)}</span><span class="position-label">第 ${pos+1} 项 / 共 ${filtered.length} 项</span><div class="progress" role="progressbar" aria-label="业务浏览位置" aria-valuenow="${pos+1}" aria-valuemin="1" aria-valuemax="${filtered.length}"><span style="width:${(pos+1)/filtered.length*100}%"></span></div></div><div class="reader-actions"><button type="button" class="page-step" id="prevEntry" ${pos===0?'disabled':''}>‹ 上一项</button><button type="button" class="page-step next" id="nextEntry" ${pos===filtered.length-1?'disabled':''}>下一项 ›</button></div></footer>`;
 $('prevEntry').addEventListener('click',()=>{if(pos>0)choose(filtered[pos-1].id,true)});
 $('nextEntry').addEventListener('click',()=>{if(pos<filtered.length-1)choose(filtered[pos+1].id,true)});
 $('page').querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();$(a.dataset.jump).scrollIntoView({behavior:motionBehavior(),block:'start'})}));
 $('page').querySelectorAll('[data-image]').forEach(b=>b.addEventListener('click',()=>openImage(b)));
 highlight();
}
function motionBehavior(){return matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}
function choose(id,scroll=false){
 if(!byId.has(id))return;activeId=id;renderToc();renderPage();closeToc(false);
 try{history.replaceState(null,'',`#${id}`)}catch(e){}
 if(scroll){$('readerWrap').scrollIntoView({behavior:motionBehavior(),block:'start'});$('businessTitle')?.focus({preventScroll:true})}
}
function runSearch(){
 clearTimeout(searchTimer);query=$('searchInput').value.trim().toLocaleLowerCase();
 const tokens=query.split(/\s+/).filter(Boolean);
 filtered=entries.filter(e=>tokens.every(t=>haystacks.get(e.id).includes(t)||(searchAliases[t]&&haystacks.get(e.id).includes(searchAliases[t]))));
 if(filtered.length&&!filtered.some(e=>e.id===activeId))activeId=filtered[0].id;
 $('clearSearch').hidden=!query;$('searchResultBar').hidden=!query;
 $('searchStatus').textContent=query?`“${$('searchInput').value.trim()}” · 找到 ${filtered.length} 项相关业务`:'';
 renderToc();renderPage();
}
function clearSearch(focus=true){$('searchInput').value='';runSearch();if(focus)$('searchInput').focus()}
function highlight(){
 if(!query)return;const terms=query.split(/\s+/).filter(Boolean).flatMap(t=>searchAliases[t]?[t,searchAliases[t]]:[t]);
 const pattern=new RegExp(terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|'),'gi');
 const walker=document.createTreeWalker($('page'),NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('button,script,style,footer,svg')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){const txt=node.nodeValue;pattern.lastIndex=0;if(!pattern.test(txt))continue;pattern.lastIndex=0;const frag=document.createDocumentFragment();let last=0;for(const match of txt.matchAll(pattern)){frag.append(txt.slice(last,match.index));const mark=document.createElement('mark');mark.textContent=match[0];frag.append(mark);last=match.index+match[0].length}frag.append(txt.slice(last));node.replaceWith(frag)}
}
function openToc(){returnFocus=document.activeElement;$('sidebar').classList.add('open');$('backdrop').classList.add('open');$('sidebar').setAttribute('role','dialog');$('sidebar').setAttribute('aria-modal','true');$('openToc').setAttribute('aria-expanded','true');document.body.classList.add('drawer-open');$('closeToc').focus()}
function closeToc(restore=true){const wasOpen=$('sidebar').classList.contains('open');$('sidebar').classList.remove('open');$('backdrop').classList.remove('open');$('sidebar').removeAttribute('role');$('sidebar').removeAttribute('aria-modal');$('openToc').setAttribute('aria-expanded','false');document.body.classList.remove('drawer-open');if(restore&&wasOpen&&returnFocus)returnFocus.focus()}
function openImage(button){$('largeImage').src=pictures[button.dataset.image];$('largeImage').alt=button.dataset.title;$('imageTitle').textContent=button.dataset.title;$('imageView').classList.remove('zoomed');$('imageDialog').showModal();$('imageView').scrollTop=0}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();runSearch();if(innerWidth<=760)$('searchInput').blur()});
$('searchInput').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,140)});
$('clearSearch').addEventListener('click',()=>clearSearch());$('resetResults').addEventListener('click',()=>clearSearch());
$('openToc').addEventListener('click',openToc);$('closeToc').addEventListener('click',()=>closeToc());$('backdrop').addEventListener('click',()=>closeToc());
$('closeImage').addEventListener('click',()=>$('imageDialog').close());$('largeImage').addEventListener('click',()=>$('imageView').classList.toggle('zoomed'));
$('serviceToggle').addEventListener('click',()=>{$('serviceImage').src=pictures.service;$('serviceDialog').showModal()});$('closeService').addEventListener('click',()=>$('serviceDialog').close());
for(const dialog of [$('imageDialog'),$('serviceDialog')])dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.addEventListener('keydown',e=>{if(!$('sidebar').classList.contains('open'))return;if(e.key==='Escape'){e.preventDefault();closeToc()}if(e.key==='Tab'){const buttons=[...$('sidebar').querySelectorAll('button')].filter(b=>b.getClientRects().length);const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id)){if(query)clearSearch(false);choose(id,true)}});
matchMedia('(min-width:761px)').addEventListener('change',e=>{if(e.matches)closeToc(false)});
window.addEventListener('scroll',()=>{$('backTop').hidden=scrollY<600},{passive:true});$('backTop').addEventListener('click',()=>$('readerWrap').scrollIntoView({behavior:motionBehavior(),block:'start'}));
renderToc();renderPage();
</script>
